<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login — LearnChemistry.in</title>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link href="assets/css/style.css" rel="stylesheet" />

</head>
<body class="d-flex flex-column min-vh-100">
    <div id="lcNavbar"></div>

    <main class="container flex-grow-1 py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card note-card p-4">
                    <h1 class="h4 fw-bold">Login / Signup</h1>
                    <div id="authMsg"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="authEmail" type="email" class="form-control" placeholder="you@example.com" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input id="authPassword" type="password" class="form-control" placeholder="••••••••" />
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Login</button>
                        <div class="d-flex justify-content-between mt-3">
                            <a href="#" class="small text-decoration-none">Forgot password?</a>
                            <a href="signup.html" class="small text-decoration-none">Create account</a>
                        </div>
                    </form>

                    <hr />
                    <button id="btnLogout" class="btn btn-outline-secondary w-100" type="button">Logout (clear session)</button>
                </div>
            </div>
        </div>
    </main>

    <div id="lcFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/nav-auth-toggle.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
