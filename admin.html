<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin — LearnChemistry.in</title>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link href="assets/css/style.css" rel="stylesheet" />

</head>
<body class="d-flex flex-column min-vh-100">
  <div id="lcNavbar"></div>

  <main class="container flex-grow-1 py-4">
    <h1 class="h3 fw-bold mb-3">Admin Panel (UI)</h1>

    <div class="row g-4">
      <section class="col-lg-5">
        <div class="card note-card p-4">
          <h5 class="mb-3">Upload PDF / Add Product</h5>
          <div id="adminMsg"></div>
          <form id="adminAddProductForm">
            <div class="mb-3">
              <label class="form-label">PDF file</label>
              <input type="file" class="form-control" />
              <div class="text-muted small mt-1">UI placeholder — backend should store file securely.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Product title</label>
              <input id="adminTitle" class="form-control" placeholder="e.g., Organic Chemistry – NEET" />
            </div>
            <div class="mb-3">
              <label class="form-label">Exam</label>
              <select id="adminExam" class="form-select">
                <option>NEET</option>
                <option>JEE</option>
                <option>Class 11/12</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Price (INR)</label>
              <input id="adminPrice" type="number" min="0" class="form-control" placeholder="299" />
            </div>
            <button class="btn btn-primary" type="submit"><i class="bi bi-plus-circle"></i> Add Product</button>
            <div class="text-muted small mt-2">Backend mapping: create product + store PDF.</div>
          </form>
        </div>
      </section>

      <section class="col-lg-7">
        <div class="card note-card p-4">
          <h5 class="mb-3">Orders</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead><tr><th>Order ID</th><th>Name</th><th>Email</th><th>Total</th><th>Date</th></tr></thead>
              <tbody id="adminOrdersBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

  </main>

  <div id="lcFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/cart.js"></script>
 <script src="assets/js/admin.js"></script>
</body>
</html>
