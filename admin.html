<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function () {
        // Hide body immediately to avoid flash
        document.documentElement.style.visibility = "hidden";

        function getRoleFromToken(token) {
        // token format: uid:role:exp.signatureHex
        if (!token) return null;
        const dot = token.indexOf(".");
        const payload = dot >= 0 ? token.substring(0, dot) : token;
        const parts = payload.split(":");
        if (parts.length < 3) return null;
        return parts[1];
        }

        const token = localStorage.getItem("lc_token");
        const role = getRoleFromToken(token);

        // If not logged in or not admin -> redirect immediately
        if (!token || role !== "ADMIN") {
        window.location.replace("login.html");
        return;
        }

        // Allowed -> show page
        document.documentElement.style.visibility = "visible";
        })();
    </script>

    <title>Admin — LearnChemistry.in</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="assets/css/style.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
    <div id="lcNavbar"></div>

    <main class="container flex-grow-1 py-4">
        <h1 class="h3 fw-bold mb-3">Admin Panel</h1>

        <div class="row g-4">
            <!-- Create Course + Upload PDF + Thumbnail -->
            <section class="col-lg-5">
                <div class="card note-card p-4">
                    <h5 class="mb-3">Upload PDF + Thumbnail / Add Product</h5>

                    <div id="adminMsg"></div>

                    <form id="adminAddProductForm">
                        <div class="mb-3">
                            <label class="form-label">PDF file</label>
                            <input id="adminPdfFile" type="file" class="form-control" accept="application/pdf" />
                            <div class="text-muted small mt-1">PDF stored securely on backend.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Thumbnail image</label>
                            <input id="adminThumbFile" type="file" class="form-control" accept="image/*" />
                            <div class="text-muted small mt-1">PNG/JPG/WebP recommended (max ~5MB).</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Product title</label>
                            <input id="adminTitle" class="form-control" placeholder="Organic Chemistry – NEET" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Exam</label>
                            <select id="adminExam" class="form-select">
                                <option>NEET</option>
                                <option>JEE</option>
                                <option>Class 11/12</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price (INR)</label>
                            <input id="adminPrice" type="number" min="0" class="form-control" placeholder="299" />
                            <div class="text-muted small mt-1">Stored as paise in DB.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="adminDesc" class="form-control" rows="3"></textarea>
                        </div>

                        <button class="btn btn-primary" type="submit" id="btnAdminSubmit">
                            <i class="bi bi-cloud-upload"></i> Create Course + Upload PDF + Thumbnail
                        </button>

                        <div class="text-muted small mt-2">
                            Backend:
                            <code>POST /v1/admin/courses</code>,
                            <code>POST /v1/admin/course-pdf/:id</code>,
                            <code>POST /v1/admin/course-thumb/:id</code>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Orders -->
            <section class="col-lg-7">
                <div class="card note-card p-4">
                    <h5 class="mb-3">Orders (DB)</h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>User Email</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="adminOrdersBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="lcFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/nav-auth-toggle.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
