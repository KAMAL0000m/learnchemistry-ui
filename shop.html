<!DOCTYPE html>
<html lang="en">
<head>
  <title>Shop — LearnChemistry.in</title>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link href="assets/css/style.css" rel="stylesheet" />

</head>
<body class="d-flex flex-column min-vh-100">
    <div id="lcNavbar"></div>

    <main class="container-fluid flex-grow-1 py-4">
        <div class="container">
            <div class="d-flex justify-content-between align-items-end flex-wrap gap-2">
                <div>
                    <h1 class="h3 fw-bold mb-1">All Notes</h1>
                    <div class="text-muted">Search and filter chemistry notes for NEET, JEE and Class 11/12.</div>
                </div>
                <div class="text-muted" id="resultCount">0 item(s)</div>
            </div>

            <div class="row g-4 mt-1">
                <aside class="col-lg-3">
                    <div class="card note-card p-3 sidebar">
                        <h5 class="mb-3">Filters</h5>

                        <label class="form-label">Exam / Category</label>
                        <select class="form-select mb-3" id="filterExam">
                            <option value="ALL">All</option>
                            <option value="NEET">NEET</option>
                            <option value="JEE">JEE</option>
                            <option value="Class 11/12">Class 11/12</option>
                        </select>

                        <label class="form-label">Max price</label>
                        <select class="form-select mb-3" id="filterPrice">
                            <option value="99999">Any</option>
                            <option value="149">₹149</option>
                            <option value="199">₹199</option>
                            <option value="249">₹249</option>
                            <option value="299">₹299</option>
                        </select>

                        <label class="form-label">Search</label>
                        <input class="form-control mb-3" id="searchInput" placeholder="Search notes..." />

                        <button class="btn btn-outline-secondary w-100" id="btnReset"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                    </div>
                </aside>

                <section class="col-lg-9">
                    <div class="row g-4" id="productGrid"></div>
                </section>
            </div>
        </div>
    </main>

    <div id="lcFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/nav-auth-toggle.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/shop.js"></script>
</body>
</html>
